# T-027 / А2.5 — имена пакетов, метки и отпечатки подписи двух Android-сборок.
# Единый источник: его читают android/app/build.gradle (BuildConfig, applicationId, метка)
# и CI (scripts/ci_verify_apk.sh, проверка ключа v3 до сборки). Здесь только ПУБЛИЧНЫЕ данные:
# отпечаток сертификата (SHA-256) — не ключ и не пароль. Ключи и пароли в git не кладём (закон L-25).
#
#   bridge — «мост» 0.1.106, старый пакет; подпись ключом v2 (он уже в репозитории: android/app/pixellnet.keystore,
#            иначе мост не встанет поверх 0.1.105). Ключ v2 опубликован — им подписываем ТОЛЬКО мост.
#   app    — новое приложение 0.1.107; подпись ключом v3 ТОЛЬКО из секретов CI (ANDROID_V3_*), в git его нет.
#
# Отпечатки — SHA-256 сертификата, как в `keytool -list -v` и `apksigner verify --print-certs`.
# В BuildConfig (PEER_CERT_SHA256) уходит строчными буквами без двоеточий (64 символа).

bridge.package=com.pixellnet.vpn
bridge.label=PIXELLNET (старое)
# v2: CN=PIXELLNET, действует до 2056-07-04; посчитан из android/app/pixellnet.keystore 28.11.2026
bridge.cert.sha256=0E:59:E5:97:76:8C:03:95:41:92:10:0D:D2:C8:96:B4:B5:2C:7B:6D:FA:77:A8:8B:FD:2E:4C:C0:81:D1:20:7C

app.package=com.pxllnet.app
app.label=PXLLNET
# v3: CN=PIXELLNET, alias pixellnet-v3, RSA 4096; создан 27.11.2026
app.cert.sha256=12:BE:C7:BE:9F:40:0B:F3:15:7C:15:AC:B8:78:7C:84:C9:C4:FB:D9:7A:A4:12:C2:99:94:1D:7B:CF:AA:0E:14
