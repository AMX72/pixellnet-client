name: Upload release to pixellnet.com

# Triggers after Build Android + Build Windows attach assets to a GitHub Release.
# Downloads those assets and uploads to https://pixellnet.com/download/ via SSH,
# updates latest-* symlinks, rotates to keep last 3 per platform, purges Cloudflare cache.

on:
  # Triggered after Build Windows completes successfully.
  # (release:published trigger does not fire because the release
  # is created by softprops/action-gh-release via GITHUB_TOKEN,
  # which cannot start other workflows — recursion safety.)
  workflow_run:
    workflows: ["Build Windows"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.81)'
        required: true

concurrency:
  group: upload-server
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ github.event.workflow_run.head_branch }}" ]; then
            echo "tag=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Wait for Android build + release to finalise
        run: sleep 30

      - name: Upload to server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_SSH_KEY: ${{ secrets.NETCUP_SSH_KEY }}
          SERVER_HOST: ${{ secrets.NETCUP_HOST }}
          SERVER_USER: ${{ secrets.NETCUP_USER }}
          CLOUDFLARE_MASTER_KEY: ${{ secrets.CLOUDFLARE_MASTER_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          chmod +x scripts/upload_release_to_server.sh
          scripts/upload_release_to_server.sh ${{ steps.tag.outputs.tag }}
